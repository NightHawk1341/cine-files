name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  IMAGE_NAME: cinefiles-app
  # Image lifecycle policy is managed via Yandex Cloud Console

jobs:
  build-and-deploy:
    name: Build and Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set deployment environment
        id: deploy-env
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "image_tag=latest" >> $GITHUB_OUTPUT
            echo "container_id=${{ secrets.YC_CONTAINER_ID }}" >> $GITHUB_OUTPUT
            echo "lockbox_id=${{ secrets.YC_LOCKBOX_SECRET_ID }}" >> $GITHUB_OUTPUT
            echo "node_env=production" >> $GITHUB_OUTPUT
          else
            echo "image_tag=staging" >> $GITHUB_OUTPUT
            echo "container_id=${{ secrets.YC_STAGING_CONTAINER_ID }}" >> $GITHUB_OUTPUT
            echo "lockbox_id=${{ secrets.YC_STAGING_LOCKBOX_SECRET_ID }}" >> $GITHUB_OUTPUT
            echo "node_env=staging" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.deploy-env.outputs.image_tag }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_KEY }}' > key.json
          yc config profile create github-actions 2>/dev/null || yc config profile activate github-actions
          yc config set service-account-key key.json
          rm key.json
          FOLDER_ID=$(yc serverless container get --id ${{ steps.deploy-env.outputs.container_id }} --format json | python3 -c "import sys,json; print(json.load(sys.stdin)['folder_id'])")
          yc config set folder-id $FOLDER_ID
          echo "Configured folder-id: $FOLDER_ID"

      - name: Deploy to Yandex Cloud Container
        env:
          IMAGE_URL: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.deploy-env.outputs.image_tag }}
          CONTAINER_ID: ${{ steps.deploy-env.outputs.container_id }}
          SA_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
          LB_ID: ${{ steps.deploy-env.outputs.lockbox_id }}
          NODE_ENV: ${{ steps.deploy-env.outputs.node_env }}
        run: |
          yc lockbox payload get --id "$LB_ID" --format json > /tmp/lb_payload.json

          python3 <<'PYEOF'
          import json, os, subprocess, sys

          with open('/tmp/lb_payload.json') as f:
              entries = json.load(f).get('entries', [])

          cmd = [
              'yc', 'serverless', 'container', 'revision', 'deploy',
              '--container-id', os.environ['CONTAINER_ID'],
              '--image', os.environ['IMAGE_URL'],
              '--cores', '1',
              '--memory', '512MB',
              '--concurrency', '16',
              '--execution-timeout', '60s',
              '--service-account-id', os.environ['SA_ID'],
              '--environment', 'NODE_ENV=' + os.environ['NODE_ENV'],
              '--environment', 'GIT_COMMIT_SHA=' + os.environ['GIT_SHA'],
          ]

          for entry in entries:
              key = entry.get('key', '')
              if key == 'NODE_ENV':
                  continue  # managed by workflow, not Lockbox
              val = next((entry[f] for f in entry if f != 'key' and isinstance(entry[f], str)), '')
              if key and val:
                  cmd.extend(['--environment', key + '=' + val])

          print('Deploying with', len(entries), 'Lockbox secrets')
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF

          DEPLOY_EXIT=$?
          rm -f /tmp/lb_payload.json
          exit $DEPLOY_EXIT

      - name: Deployment Summary
        run: |
          echo "Deployment successful!"
          echo "Environment: ${{ steps.deploy-env.outputs.node_env }}"
          echo "Image: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:${{ steps.deploy-env.outputs.image_tag }}"
          echo "Container ID: ${{ steps.deploy-env.outputs.container_id }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed! Check the logs above for details."
          exit 1
