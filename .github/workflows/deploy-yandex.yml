name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: cr.yandex
  IMAGE_NAME: cinefiles-app

jobs:
  build-and-deploy:
    name: Build and Deploy to Yandex Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure Yandex Cloud CLI
        run: |
          echo '${{ secrets.YC_SA_JSON_KEY }}' > key.json
          yc config profile create github-actions
          yc config set service-account-key key.json
          rm key.json

      - name: Deploy to Yandex Cloud Container
        env:
          IMAGE_URL: ${{ env.REGISTRY }}/${{ secrets.YC_REGISTRY_ID }}/${{ env.IMAGE_NAME }}:latest
          CONTAINER_ID: ${{ secrets.YC_CONTAINER_ID }}
          SA_ID: ${{ secrets.YC_SERVICE_ACCOUNT_ID }}
          GIT_SHA: ${{ github.sha }}
          LB_ID: ${{ secrets.YC_LOCKBOX_SECRET_ID }}
        run: |
          yc lockbox payload get --id "$LB_ID" --format json > /tmp/lb_payload.json

          python3 <<'PYEOF'
          import json, os, subprocess, sys

          with open('/tmp/lb_payload.json') as f:
              entries = json.load(f).get('entries', [])

          cmd = [
              'yc', 'serverless', 'container', 'revision', 'deploy',
              '--container-id', os.environ['CONTAINER_ID'],
              '--image', os.environ['IMAGE_URL'],
              '--cores', '1',
              '--memory', '512MB',
              '--concurrency', '16',
              '--execution-timeout', '60s',
              '--service-account-id', os.environ['SA_ID'],
              '--environment', 'NODE_ENV=production',
              '--environment', 'GIT_COMMIT_SHA=' + os.environ['GIT_SHA'],
          ]

          for entry in entries:
              key = entry.get('key', '')
              val = next((entry[f] for f in entry if f != 'key' and isinstance(entry[f], str)), '')
              if key and val:
                  cmd.extend(['--environment', key + '=' + val])

          print('Deploying with', len(entries), 'Lockbox secrets')
          result = subprocess.run(cmd)
          sys.exit(result.returncode)
          PYEOF

          DEPLOY_EXIT=$?
          rm -f /tmp/lb_payload.json
          exit $DEPLOY_EXIT

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment failed. Check the logs above for details."
          exit 1
